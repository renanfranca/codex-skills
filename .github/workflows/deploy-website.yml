name: Verify and deploy website

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/deploy-website.yml"
      - "evaluation-reports/**"
      - "website/**"
      - "*/SKILL.md"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/deploy-website.yml"
      - "evaluation-reports/**"
      - "website/**"
      - "*/SKILL.md"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: website-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.62.0-jammy@sha256:b012874f829d298730411256666afcaeaeebaf505a0cf4c2f668d6dedb3d1e80
      options: --init --ipc=host
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Verify container Python
        run: python3 --version

      - name: Install website dependencies
        run: npm ci --prefix website
        env:
          HUSKY: 0

      - name: Run deterministic behavior tests
        run: npm test --prefix website

      - name: Build website
        run: npm run build --prefix website

      - name: Run public path checkpoints
        id: public_path_checkpoints
        run: npm run test:e2e:direct --prefix website

      - name: Upload Playwright failure diagnostics
        if: ${{ failure() && steps.public_path_checkpoints.outcome == 'failure' }}
        uses: actions/upload-artifact@v6
        with:
          name: playwright-test-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: website/test-results
          if-no-files-found: warn
          retention-days: 7

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: website/.vitepress/dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
